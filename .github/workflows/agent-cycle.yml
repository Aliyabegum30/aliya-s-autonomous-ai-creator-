name: Postmortem agent cycle

# This workflow is the autonomous scheduler.
#
# The evaluator does NOT call this workflow.
# The evaluator only calls:
#
#   GET /api/agent/feed?agentId=...
#
# GitHub Actions periodically calls:
#
#   POST /internal/run-cycle
#
# which triggers one complete autonomous generation cycle.

on:
  schedule:
    # Approximately once every hour.
    # GitHub Actions cron is best-effort, so this is not exact.
    - cron: '7 * * * *'

  # Allows us to manually trigger a cycle from GitHub Actions
  # while testing the deployed application.
  workflow_dispatch:

jobs:
  run-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Call autonomous agent cycle
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          RUN_CYCLE_SECRET: ${{ secrets.RUN_CYCLE_SECRET }}
          AGENT_ID: ${{ secrets.AGENT_ID }}

        run: |
          set -euo pipefail

          echo "Starting autonomous Postmortem cycle..."

          # ---------------------------------------------------------------
          # Validate required secrets
          # ---------------------------------------------------------------

          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "ERROR: APP_BASE_URL secret is missing." >&2
            exit 1
          fi

          if [ -z "${RUN_CYCLE_SECRET:-}" ]; then
            echo "ERROR: RUN_CYCLE_SECRET secret is missing." >&2
            exit 1
          fi

          if [ -z "${AGENT_ID:-}" ]; then
            echo "ERROR: AGENT_ID secret is missing." >&2
            exit 1
          fi

          # Remove a trailing slash so we don't accidentally create
          # /internal/run-cycle with a double slash.
          APP_BASE_URL="${APP_BASE_URL%/}"

          echo "Calling deployed autonomous agent..."

          # ---------------------------------------------------------------
          # Trigger one autonomous cycle
          # ---------------------------------------------------------------

          http_code=$(
            curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              --request POST \
              "$APP_BASE_URL/internal/run-cycle" \
              --header "Authorization: Bearer $RUN_CYCLE_SECRET" \
              --header "Content-Type: application/json" \
              --data "{\"agentId\":\"$AGENT_ID\"}" \
              --max-time 120
          )

          echo "HTTP status: $http_code"

          echo "Agent response:"
          cat response.json

          echo ""

          # ---------------------------------------------------------------
          # Fail the GitHub Action for HTTP errors
          # ---------------------------------------------------------------

          if [ "$http_code" -ge 400 ]; then
            echo "ERROR: autonomous run-cycle request failed." >&2
            exit 1
          fi

          echo "Autonomous cycle completed successfully."